<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation, Callback and Chaining</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>
</head>

<style>
*{
    margin: 0%;
    padding: 0%;
    box-sizing: border-box;
}

body{
    font-family: Arial, Helvetica, sans-serif;
    background: #fff4e6;
    text-align: center;
    padding: 30px;
    overflow-x: hidden;
}

h1{
    color: #12343b;
    margin-bottom: 10px;
}

#message{
    font-size: 18px;
    color: #444;
    margin-bottom: 25px;
}

/* Animated Box */

#box{
    width: 140px;
    height: 100px;
    background: #e76f51;
    color: white;
    position: relative;
    left: 5px;
    padding: 20px;
    margin: 30px auto;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

button{
    padding: 12px 22px;
    margin: 8px;
    border: none;
    border-radius: 8px;
    background: #2a9d8f;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover{
    background: #12343b;
}

#myImage{
    width: 300px;
    height: 300px;
    border-radius: 15px;
    margin: 25px auto;
    display: none;
    box-shadow: 0px 5px 15px gray;
}


@media(max-width:600px){

    body{
        padding: 20px;
    }

    h1{
        font-size: 26px;
    }

    #box{
        margin-left: 20px;
    }

    button{
        width: 80%;
    }

    #myImage{
        width: 90%;
        height: 300px;
    }
}

</style>

<body>
    
    <h1>
        jQuery Animation
    </h1>

    <p id="message">
     Click Start Animation
    </p>

    <!-- Animated Box -->

    <div id="box">
        Nature Vibes 
    </div>


    <!-- Image -->

    <img id="myImage"
        src="https://plus.unsplash.com/premium_photo-1734463718301-d74b7e9e46dd?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Nature Heart Image">


        <!-- Sound -->

        <audio id="mysound">

            <source src="Images/naturesound.mp3" type="audio/mpeg">
        </audio>


        <!-- Buttons -->

        <button id="start">
            Start Animation
        </button>

        <button id="color">
            Change Color
        </button>

        <button id="reset">
            Reset
        </button>

        <script>

$(document).ready(function(){


    /* START FUNCTION */

    $("#start").click(function(){

        $("#message").text("Animation Running...");

        $("#box")
        .animate({left:"250px"},1000)

        .delay(500)

        .animate({
            width:"200px",
            height:"120px",
            borderRadius:"30px"
        },1000,complete);
    });


    /* CALLBACK FUNCTION */

    function complete(){

        $("#message").text("Animation Completed!");

        $("#box").css({
            "background":"#2a9d8f"
        });

        $("#myImage").fadeIn(1000);

        $("#mysound")[0].play();
    }



    /* RANDOM COLOR FUNCTION */

    function changecolor(){

        var r,g,b;

        r = Math.round(Math.random()*255);
        g = Math.round(Math.random()*255);
        b = Math.round(Math.random()*255);

        $("#box").css({
            "background":"rgb("+r+","+g+","+b+")"
        });
    }



    /* COLOR BUTTON */

    $("#color").click(function(){

        changecolor();
    });

    /* RESET BUTTON */

    $("#reset").click(function(){

        $("#box").stop(true,true);

        $("#box").css({

            "left":"5px",
            "width": "140px",
            "height": "100px",
            "borderRadius":"10px",
            "background":"#e76f51"
        });


    $("#myImage").fadeOut(500);

    $("#mysound")[0].pause();
    $("#mysound")[0].currentTime = 0;

    $("#message").text("Click Start Animation");

    });


});

</script>

</body>
</html>
