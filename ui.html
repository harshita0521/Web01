<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Effects</title>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- jQuery UI -->
<link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">

<script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"></script>

</head>

<style>

*{
    margin: 0%;
    padding: 0%;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    background: linear-gradient(135deg,rgb(194, 17, 53),pink);
    padding: 40px;
    text-align: center;
    background-repeat: no-repeat;
    background-size:cover;
    background-attachment: fixed;
}

.container{
    width: 80%;
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0px 0px 15px gray;
}

h1{
    margin-bottom: 20px;
    color: #003366;
}

img{
    width: 100%;
    height: 400px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 20px;
}

button{
    padding: 12px 20px;
    margin:8px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: white;
}

button{
    background: linear-gradient(130deg,lightcoral,#003366);
}

button:hover{
    background:linear-gradient(100deg,#003366,lightcoral);
}

@media(max-width:600px){

.container{
width:95%;
}

img{
height:220px;
}

button{
width:100%;
margin-left:2px;
}
}
</style>

<body>

    <div class="container">
        <h1>jQuery UI Effects</h1>
        <img id="photo" 
        src="https://i.pinimg.com/736x/0e/e5/28/0ee52862bcdf44b084ca51f756a55da2.jpg" alt="picture">
        <br>

        <button id="toggle">Toggle</button>
        <button id="bounce">Bounce</button>
        <button id="explode">Explode</button>
        <button id="slide">Slide</button>
    </div>

    <script>

        $(document).ready(function(){
            $("#toggle").click(function(){
                $("#photo").toggle(1000);
            });

            $("#bounce").click(function(){
                $("#photo").effect("bounce",{timees:3},1000);
            });

            $("#explode").click(function(){
                $("#photo").toggle("explode",1000)
            });

            $("#slide").click(function(){

            $("#photo").toggle("slide",1000);
            });
        })
    </script>
    
</body>
</html>
